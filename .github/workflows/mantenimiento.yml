name: Mantenimiento Tenute (migración barcode + rellenar fotos)

# Dos formas de ejecutarlo:
#   - Manual: Actions -> "Run workflow" (workflow_dispatch).
#   - Por push a la rama 'run-maintenance' (corre las dos tareas en modo real).
#
# SECRETS (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL  (migración; "Session pooler" IPv4, URI postgresql://)  [opcional]
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   PRODUCT_IMAGES_BUCKET (opcional, ej. 'products'), BING_API_KEY (opcional)
#
# La migración y el relleno son INDEPENDIENTES: si falta SUPABASE_DB_URL se
# omite la migración pero igual se rellenan las fotos.

on:
  push:
    branches: [run-maintenance]
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Ejecutar migración de barcode (requiere SUPABASE_DB_URL)'
        type: boolean
        default: true
      fill_images:
        description: 'Rellenar fotos faltantes (requiere secrets de Supabase)'
        type: boolean
        default: true
      fill_eans:
        description: 'Nutrir EAN/códigos de barra desde proveedores'
        type: boolean
        default: true
      images_dry_run:
        description: 'Fotos en modo prueba (no escribe, solo reporta)'
        type: boolean
        default: false

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migración barcode (psql)
        if: ${{ github.event_name == 'push' || inputs.run_migration }}
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL no configurado; se OMITE la migración de barcode (las fotos sí se rellenan)."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase-migration-barcode-fix.sql
          echo "Migración de barcode aplicada."

      - name: Setup Node
        if: ${{ always() && (github.event_name == 'push' || inputs.fill_images) }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        if: ${{ always() && (github.event_name == 'push' || inputs.fill_images) }}
        run: npm install --no-audit --no-fund

      - name: Rellenar fotos faltantes
        if: ${{ always() && (github.event_name == 'push' || inputs.fill_images) }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCT_IMAGES_BUCKET: ${{ secrets.PRODUCT_IMAGES_BUCKET }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then echo "::error::Falta el secret $v"; exit 1; fi
          done
          if [ "${{ inputs.images_dry_run }}" = "true" ]; then
            npm run fill:images:ci -- --dry-run
          else
            npm run fill:images:ci
          fi

      - name: Nutrir EAN (códigos de barra)
        if: ${{ always() && (github.event_name == 'push' || inputs.fill_eans) }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then echo "::error::Falta el secret $v"; exit 1; fi
          done
          if [ "${{ inputs.images_dry_run }}" = "true" ]; then
            npm run fill:eans:ci -- --dry-run
          else
            npm run fill:eans:ci
          fi

      - name: Subir reporte de fotos
        if: ${{ always() && (github.event_name == 'push' || inputs.fill_images) }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-fotos
          path: tmp/*.json
          if-no-files-found: ignore
